name: Pull Wiki Templates (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pull-templates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Templates Puller
        run: python src/scripts/utils/pull_templates.py

      - name: Commit templates to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/global/templates/ src/shared/ src/local/
          git status --short
          if ! git diff --staged --quiet; then
            git commit -m "Автоматическая выгрузка и дедупликация шаблонов с вики [skip ci]"
            git pull --rebase origin main
            git push
          fi
