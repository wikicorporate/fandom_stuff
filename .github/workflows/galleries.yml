name: Auto-Sync Galleries

on:
  # Автозапуск по расписанию отключён до завершения тестирования скрипта.
  # schedule:
  #   - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Тестовый режим без сохранения на вики (вывод diff в лог)'
        required: true
        default: true
        type: boolean
      page:
        description: 'Название одной страницы для теста (например: Аластор/Галерея)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Лимит статей за прогон (0 = без лимита)'
        required: false
        default: '5'
        type: string

concurrency:
  group: fandom-galleries
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-galleries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mwclient mwparserfromhell requests

      - name: Run Gallery Bot (Personal Account)
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PAGE: ${{ inputs.page }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "false" ]; then
            ARGS+=("--enable")
          else
            ARGS+=("--dry-run")
          fi
          if [ -n "$INPUT_PAGE" ]; then
            ARGS+=("--page" "$INPUT_PAGE")
          fi
          if [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "0" ]; then
            ARGS+=("--limit" "$INPUT_LIMIT")
          fi
          python src/scripts/bots/sync_galleries.py "${ARGS[@]}"
