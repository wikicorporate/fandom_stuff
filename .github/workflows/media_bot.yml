name: Auto-Format Media Links

on:
  schedule:
    - cron: '0 2 * * 3,6' # Каждую среду и субботу в 02:00 UTC
  workflow_dispatch:

concurrency:
  group: fandom-media-bot
  cancel-in-progress: false

jobs:
  format-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Run Media Replacer Bot (Bot Account)
        env:
          FANDOM_BOT_USERNAME: ${{ secrets.FANDOM_BOT_USERNAME }}
          FANDOM_BOT_PASSWORD: ${{ secrets.FANDOM_BOT_PASSWORD }}
        run: python src/scripts/bots/media_replacer.py
