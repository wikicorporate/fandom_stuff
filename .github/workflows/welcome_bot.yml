name: Welcome Users

on:
  schedule:
    - cron: '0 */3 * * *' # Каждые 3 часа
  workflow_dispatch:

concurrency:
  group: fandom-welcome-bot
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Run Welcome Script (Personal Account)
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: python src/scripts/bots/welcome_bot.py

      - name: Commit updated welcomed_users database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/welcomed_users.json
          if ! git diff --staged --quiet; then
            git commit -m "Обновление базы поприветствованных участников [skip ci]"
            git pull --rebase origin main
            git push
          fi
