name: Wiki Maintenance Bots

on:
  schedule:
    - cron: '0 5 * * 0' # Каждое воскресенье в 05:00 UTC
  workflow_dispatch:

concurrency:
  group: fandom-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mwclient mwparserfromhell requests

      - name: Run Typographer (Bot Account)
        env:
          FANDOM_BOT_USERNAME: ${{ secrets.FANDOM_BOT_USERNAME }}
          FANDOM_BOT_PASSWORD: ${{ secrets.FANDOM_BOT_PASSWORD }}
        run: python src/scripts/bots/typographer.py

      - name: Run Redirect Resolver (Bot Account)
        env:
          FANDOM_BOT_USERNAME: ${{ secrets.FANDOM_BOT_USERNAME }}
          FANDOM_BOT_PASSWORD: ${{ secrets.FANDOM_BOT_PASSWORD }}
        run: python src/scripts/bots/resolve_redirects.py
