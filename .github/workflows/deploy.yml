name: Sync to Fandom

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config.json'
      - 'sync.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mwclient

      - name: Build CWA Script
        run: python src/build_cwa.py

      - name: Run Sync Script
        env:
          WIKI_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: python sync.py
