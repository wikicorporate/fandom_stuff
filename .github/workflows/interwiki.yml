name: Auto-Update Interwiki

on:
  schedule:
    - cron: '0 3 * * *' # Каждый день в 03:00 UTC (06:00 МСК)
  workflow_dispatch:

concurrency:
  group: fandom-interwiki
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests mwclient

      - name: Run Interwiki Spider
        run: python src/scripts/utils/update_interwiki.py

      - name: Commit updated JSONs back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/local/
          git status
          if ! git diff --staged --quiet; then
            git commit -m "Автоматическое обновление интервики-ссылок [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Sync with Fandom (Admin Account)
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: python sync.py
