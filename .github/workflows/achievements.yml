name: Auto-Update Custom Achievements

on:
  schedule:
    - cron: '30 */6 * * *' # Каждые 6 часов
  workflow_dispatch:

concurrency:
  group: fandom-achievements
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Run Achievements Bot
        run: python src/scripts/bots/achievements_bot.py

      - name: Commit updated Custom-Achievements.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/local/
          if ! git diff --staged --quiet; then
            git commit -m "Автоматическое обновление базы кастомных достижений [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Sync with Fandom (Admin Account)
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: python sync.py
