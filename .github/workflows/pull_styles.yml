name: Pull Wiki Styles (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pull-css:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run CSS Puller
        run: python src/scripts/utils/pull_styles.py

      - name: Upload CSS dumps as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: css_dumps
          path: css_dumps/*.txt

      - name: Commit styles to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/local/*/styles/
          if ! git diff --staged --quiet; then
            git commit -m "Выгрузка текущих таблиц стилей с вики [skip ci]"
            git pull --rebase origin main
            git push
          fi
